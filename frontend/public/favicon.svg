<svg xmlns="http://www.w3.org/2000/svg" width="48" height="46" fill="none" viewBox="0 0 48 46">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5fb3c4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c5eff6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4aa3b5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8dd3e8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- 主体圆形 -->
  <circle cx="24" cy="23" r="20" fill="url(#grad1)" opacity="0.9"/>
  <!-- 内部装饰圆 -->
  <circle cx="24" cy="23" r="14" fill="url(#grad2)" opacity="0.6"/>
  <!-- AI 文字 -->
  <text x="24" y="28" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">AI</text>
  <!-- 顶部装饰 -->
  <ellipse cx="24" cy="8" rx="8" ry="3" fill="#c5eff6" opacity="0.7"/>
</svg>
